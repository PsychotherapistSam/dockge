name: Build

# Every push: lint, type-check and build the frontend.
# Images go to ghcr.io/<owner>/<repo> (pushed with the repository's own GITHUB_TOKEN) only for:
#   - pushes to master          -> :master, :sha-<short>
#   - "Run workflow" on a branch -> :<branch-name>, :sha-<short>
#   - releases (Release workflow or a pushed vX.Y.Z tag) -> :X.Y.Z, :X.Y, :X, :latest

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "*.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z) to publish
        type: string
        required: true
      ref:
        description: Git ref (the release tag) to build
        type: string
        required: true

permissions: {}

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || inputs.version != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run check-ts

      - name: Build frontend
        run: npm run build:frontend

      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.PUBLISH == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ env.RELEASE != 'true' }}
            type=sha,prefix=sha-,enable=${{ env.RELEASE != 'true' }}
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' }}

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
